[project]
name = "mcx"
version = "0.1.0"
description = "Cluster automation CLI for the oficina k3s cluster"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "psycopg2-binary>=2.9",
]

[project.scripts]
mcx = "mcx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/mcx"]
omit = ["src/mcx/cli.py"]

[tool.coverage.report]
fail_under = 90
