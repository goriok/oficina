---
# Reexecuta o join de um ou mais agents após replace/reprovisionamento da VM.
# Necessário porque o cloud-init não executa o join automaticamente (race condition
# com o node-token real — ver RFC D11).
#
# Pré-requisito: obter o node-token atual do server:
#   ssh ubuntu@<server-ip> "sudo cat /var/lib/rancher/k3s/server/node-token"
#
# Uso (todos os agents):
#   ansible-playbook -i ansible/inventory.ini ansible/playbooks/k3s-agents-rejoin.yml \
#     -e k3s_token=<node-token>
#
# Uso (agent específico, ex: após replace do agent-essential):
#   ansible-playbook -i ansible/inventory.ini ansible/playbooks/k3s-agents-rejoin.yml \
#     -e k3s_token=<node-token> --limit oficina-agent-essential

- name: Rejoin k3s agents ao cluster
  hosts: k3s_agents
  become: true

  tasks:
    - name: Para k3s-agent se estiver rodando
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped
      ignore_errors: true

    - name: Remove dados de estado antigos do k3s
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher/k3s/agent
        - /etc/rancher/k3s/k3s.env

    - name: Atualiza environment file com novo token
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-agent.service.env
        mode: "0600"
        content: |
          K3S_URL={{ k3s_server_url }}
          K3S_TOKEN={{ k3s_token }}

    - name: Reinstala k3s agent com novo token
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | sh -s - agent
      environment:
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ k3s_token }}"
        INSTALL_K3S_EXEC: >-
          --node-label tier={{ k3s_tier }}
          {% if k3s_taint %}--node-taint tier={{ k3s_tier }}:NoSchedule{% endif %}

    - name: Recarrega systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Habilita e inicia k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: restarted

    - name: Aguarda k3s-agent ficar ativo
      ansible.builtin.systemd:
        name: k3s-agent
      register: agent_status
      until: agent_status.status.ActiveState == "active"
      retries: 12
      delay: 5

    - name: Status final
      ansible.builtin.debug:
        msg: "k3s-agent em {{ inventory_hostname }}: {{ agent_status.status.ActiveState }}"
