[cluster]
# registry reachable at localhost:5000 from inside the VPS
registry = "container-registry.br-se1.magalu.cloud/my-registry"

[[apps]]
name = "distill-rss"
source_path = "../distill-rss"
kustomize_path = "k8s/apps/distill-rss"
rsync_excludes = [
  ".venv/",
  ".git/",
  "__pycache__/",
  ".pytest_cache/",
  ".ruff_cache/",
  "*.db",
  "*.db-shm",
  "*.db-wal",
  ".env",
]

