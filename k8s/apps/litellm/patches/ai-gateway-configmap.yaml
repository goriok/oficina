# Patch: redireciona chamadas LLM do litellm pelo Cloudflare AI Gateway.
#
# Substituir <ACCOUNT_ID> pelo account_id real antes de aplicar.
# Obter o account_id via: terraform -chdir=terraform/cloudflare output -raw ai_gateway_openai_url
#
# Aplicar: kubectl apply -k k8s/apps/litellm/
# Nota: o configmap é recriado, não patcheado — o campo data.config.yaml é substituído.
#
# Este patch NÃO está registrado no kustomization.yaml principal por ser opt-in:
# ativar adicionando "patches/ai-gateway-configmap.yaml" em patchesStrategicMerge
# do kustomization.yaml do litellm e substituindo o <ACCOUNT_ID>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: deepseek-v4-flash
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          api_base: "https://gateway.ai.cloudflare.com/v1/<ACCOUNT_ID>/oficina-cluster/deepseek"

      - model_name: deepseek-v4-pro
        litellm_params:
          model: deepseek/deepseek-v4-pro
          api_key: os.environ/DEEPSEEK_API_KEY
          api_base: "https://gateway.ai.cloudflare.com/v1/<ACCOUNT_ID>/oficina-cluster/deepseek"

    mcp_servers:
      mcx_companion:
        transport: "sse"
        url: "http://mcx-companion.mcx-companion.svc.cluster.local/mcp/sse"

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true

    litellm_settings:
      callbacks: ["prometheus"]
