apiVersion: v1
kind: ConfigMap
metadata:
  name: distill-rss-config
  namespace: distill-rss
data:
  DAILY_TOKEN_LIMIT: "1000000"
  WEEKLY_TOKEN_LIMIT: "2000000"
  BUDGET_WARN_THRESHOLD: "0.80"
  BUDGET_STOP_THRESHOLD: "0.90"
  MODEL_FILTER: "deepseek-chat"
  MODEL_ANALYZER: "deepseek-chat"
  MODEL_REFLECTION: "deepseek-reasoner"
  LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
  MAX_ARTICLE_AGE_DAYS: "7"
  FEEDS_CONFIG: "/app/feeds.toml"
  FEEDS_CONFIG_GEOPOLITICS: "/app/feeds-geopolitics.toml"
  DIGESTS_DIR: "/data/digests"
