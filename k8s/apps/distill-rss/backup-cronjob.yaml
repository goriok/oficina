apiVersion: batch/v1
kind: CronJob
metadata:
  name: distill-rss-backup
  namespace: distill-rss
  labels:
    app: distill-rss
    role: backup
spec:
  # 03:00 UTC daily — after vaultwarden-backup (02:00) to avoid I/O contention
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: distill-rss
            role: backup
        spec:
          restartPolicy: Never
          serviceAccountName: distill-rss-backup
          containers:
            - name: backup
              image: postgres:16
              command:
                - /bin/sh
                - -euc
                - |
                  apt-get update -qq && apt-get install -y -qq restic wget ca-certificates

                  restic snapshots --json 2>/dev/null || restic init

                  pg_dump "$DATABASE_URL" > /tmp/distill.sql

                  restic backup \
                    /tmp/distill.sql \
                    --tag distill-rss

                  restic forget \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 3 \
                    --prune \
                    --tag distill-rss

                  echo "Backup complete."

                  wget -qO- "${HEALTHCHECK_URL}" > /dev/null
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: distill-rss-secret
                      key: DATABASE_URL
                - name: RESTIC_REPOSITORY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: RESTIC_REPOSITORY
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: HEALTHCHECK_URL
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: HEALTHCHECK_URL
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
