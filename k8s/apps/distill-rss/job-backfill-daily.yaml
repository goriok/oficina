apiVersion: batch/v1
kind: Job
metadata:
  name: distill-rss-backfill-daily
  namespace: distill-rss
  labels:
    app: distill-rss
    role: backfill
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: distill-rss
        role: backfill
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: mgc-registry-credentials
      tolerations:
      - key: tier
        value: standard
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - standard
      containers:
        - name: distill-rss-backfill-daily
          image: container-registry.br-se1.magalu.cloud/my-registry/distill-rss:latest
          command:
            - sh
            - -c
            - |
              for i in 1 2 3 4 5 6 7; do
                DAY=$(date -d "-${i} days" +%Y-%m-%d 2>/dev/null || date -v-${i}d +%Y-%m-%d)
                echo "=== Backfilling $DAY ==="
                distill daily --profile ai --date "$DAY" --force
                distill daily --profile geopolitics --date "$DAY" --force
              done
              echo "=== Backfill complete ==="
          envFrom:
            - configMapRef:
                name: distill-rss-config
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: LITELLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: digests
              mountPath: /data/digests
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: digests
          persistentVolumeClaim:
            claimName: distill-rss-digests
