apiVersion: batch/v1
kind: Job
metadata:
  name: distill-rss-clean
  namespace: distill-rss
  labels:
    app: distill-rss
    role: clean
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: distill-rss
        role: clean
    spec:
      restartPolicy: Never
      containers:
        - name: distill-rss-clean
          image: registry.registry.svc.cluster.local:5000/distill-rss:latest
          command:
            - sh
            - -c
            - distill clean --yes
          envFrom:
            - configMapRef:
                name: distill-rss-config
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: LITELLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: digests
              mountPath: /data/digests
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: digests
          persistentVolumeClaim:
            claimName: distill-rss-digests
