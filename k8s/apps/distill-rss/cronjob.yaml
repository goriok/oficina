apiVersion: batch/v1
kind: CronJob
metadata:
  name: distill-rss-pipeline
  namespace: distill-rss
  labels:
    app: distill-rss
spec:
  schedule: "0 6 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: distill-rss
            role: pipeline
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: mgc-registry-credentials
          tolerations:
          - key: tier
            value: standard
            effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                    - standard
          containers:
            - name: distill-rss-pipeline
              image: container-registry.br-se1.magalu.cloud/my-registry/distill-rss:latest
              command:
                - sh
                - -c
                - |
                  distill run --incremental
                  distill daily --profile ai
                  curl -fsS --retry 3 "$HEALTHCHECK_URL"
              envFrom:
                - configMapRef:
                    name: distill-rss-config
              env:
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: distill-rss-secret
                      key: LITELLM_API_KEY
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: distill-rss-secret
                      key: DATABASE_URL
                - name: HEALTHCHECK_URL
                  valueFrom:
                    secretKeyRef:
                      name: distill-rss-pipeline-secret
                      key: HEALTHCHECK_URL
              volumeMounts:
                - name: digests
                  mountPath: /data/digests
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "512Mi"
          volumes:
            - name: digests
              persistentVolumeClaim:
                claimName: distill-rss-digests
