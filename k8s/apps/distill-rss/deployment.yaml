apiVersion: apps/v1
kind: Deployment
metadata:
  name: distill-rss
  namespace: distill-rss
  labels:
    app: distill-rss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distill-rss
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: distill-rss
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: distill-rss
          image: registry.registry.svc.cluster.local:5000/distill-rss:latest
          imagePullPolicy: Always
          command: ["distill", "serve", "--host", "0.0.0.0", "--port", "8000", "--all-profiles"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: distill-rss-config
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: LITELLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distill-rss-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: digests
              mountPath: /data/digests
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: digests
          persistentVolumeClaim:
            claimName: distill-rss-digests
