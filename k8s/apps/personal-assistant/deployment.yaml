apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-assistant
  namespace: personal-assistant
  labels:
    app: personal-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: personal-assistant
    spec:
      imagePullSecrets:
        - name: mgc-registry-credentials
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - essential
      tolerations:
      - key: tier
        value: essential
        effect: NoSchedule
      containers:
        - name: personal-assistant
          image: container-registry.br-se1.magalu.cloud/my-registry/personal-assistant:latest
          imagePullPolicy: Always
          ports:
            - name: gateway
              containerPort: 18789
          env:
            - name: LITELLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: LITELLM_BASE_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: LITELLM_API_KEY
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLAW_HOOKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: OPENCLAW_HOOKS_TOKEN
            - name: COMPANIONS_URL
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: COMPANIONS_URL
            - name: COMPANIONS_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: COMPANIONS_AGENT_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: personal-assistant-secret
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 18789
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: personal-assistant-workspace
