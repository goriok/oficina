apiVersion: batch/v1
kind: CronJob
metadata:
  name: personal-assistant-distill-review
  namespace: personal-assistant
  labels:
    app: personal-assistant
    role: cron
spec:
  schedule: "0 9 * * *"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          tolerations:
          - key: tier
            value: essential
            effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                    - essential
          containers:
            - name: trigger
              image: alpine/curl:latest
              command:
                - sh
                - -c
                - |
                  PA_URL="http://personal-assistant.personal-assistant.svc.cluster.local:18789"

                  # Wait until personal-assistant is ready (max 120s)
                  echo "Waiting for personal-assistant to be ready..."
                  for i in $(seq 1 24); do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PA_URL/")
                    if [ "$STATUS" = "200" ]; then
                      echo "HTTP ready after $((i * 5))s, waiting 15s for agent init..."
                      sleep 15
                      break
                    fi
                    if [ "$i" = "24" ]; then
                      echo "Timeout waiting for personal-assistant" >&2
                      exit 1
                    fi
                    sleep 5
                  done

                  TODAY=$(date +%Y-%m-%d)
                  BODY="Revise o digest de AI engineering de hoje (${TODAY}) do distill-rss (perfil: ai, URL: http://distill-rss.distill-rss.svc.cluster.local/api/digest/${TODAY}). Para cada artigo com recommended_action=deep_read ou relevance_score >= 0.8: avalie se ha algo acionavel para (1) configurar ou melhorar o code-agent (Claude Code, opencode, agentes em ~/.config/opencode), ou (2) mudar algo no my-cluster (infra, apps, monitoring). Seja direto: liste so o que for genuinamente acionavel com uma sugestao concreta. Se nao houver nada acionavel hoje, diga isso em uma frase. Posta o resultado no canal assistant do companions."

                  # Escape body for JSON (backslash, double-quote, newline)
                  ESCAPED=$(printf '%s' "$BODY" | sed 's/\\/\\\\/g; s/"/\\"/g')
                  PAYLOAD="{\"path\":\"companions/chat\",\"channel\":\"assistant\",\"body\":\"${ESCAPED}\"}"

                  curl -fsS -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${OPENCLAW_HOOKS_TOKEN}" \
                    -d "$PAYLOAD" \
                    "$PA_URL/hooks/companions/chat"
              env:
                - name: OPENCLAW_HOOKS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: personal-assistant-secret
                      key: OPENCLAW_HOOKS_TOKEN
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "50m"
                  memory: "32Mi"
