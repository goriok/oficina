apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcx-companion
  namespace: mcx-companion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcx-companion
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcx-companion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcx-companion
subjects:
  - kind: ServiceAccount
    name: mcx-companion
    namespace: mcx-companion
