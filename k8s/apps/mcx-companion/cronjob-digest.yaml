apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcx-companion-digest
  namespace: mcx-companion
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: mcx-companion
          restartPolicy: Never
          imagePullSecrets:
            - name: mgc-registry-credentials
          tolerations:
          - key: tier
            value: standard
            effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                    - standard
          containers:
            - name: mcx-companion
              image: container-registry.br-se1.magalu.cloud/my-registry/mcx-companion:latest
              imagePullPolicy: Always
              command: ["mcx-companion", "digest"]
              envFrom:
                - secretRef:
                    name: mcx-companion-secret
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
