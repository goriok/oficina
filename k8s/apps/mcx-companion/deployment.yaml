apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcx-companion
  namespace: mcx-companion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcx-companion
  template:
    metadata:
      labels:
        app: mcx-companion
    spec:
      serviceAccountName: mcx-companion
      imagePullSecrets:
        - name: mgc-registry-credentials
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - standard
      tolerations:
      - key: tier
        value: standard
        effect: NoSchedule
      containers:
        - name: mcx-companion
          image: container-registry.br-se1.magalu.cloud/my-registry/mcx-companion:latest
          imagePullPolicy: Always
          command: ["mcx-companion", "serve"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: mcx-companion-secret
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
