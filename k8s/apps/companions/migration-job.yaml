apiVersion: batch/v1
kind: Job
metadata:
  name: companions-migration
  namespace: companions
  labels:
    app: companions
    component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: companions
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: registry.registry.svc.cluster.local:5000/companions:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: companions-secret
                  key: DATABASE_URL
