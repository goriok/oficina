apiVersion: apps/v1
kind: Deployment
metadata:
  name: cantinho
  namespace: cantinho
  labels:
    app: cantinho
    platform.oficina/tenant: personal
    platform.oficina/app: cantinho
    platform.oficina/owner: igorsoaresalves
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cantinho
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cantinho
        platform.oficina/tenant: personal
        platform.oficina/app: cantinho
        platform.oficina/owner: igorsoaresalves
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: mgc-registry-credentials
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - standard
      tolerations:
      - key: tier
        value: standard
        effect: NoSchedule
      containers:
        - name: cantinho
          image: container-registry.br-se1.magalu.cloud/my-registry/cantinho:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cantinho-config
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cantinho-secrets
                  key: LITELLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cantinho-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2
