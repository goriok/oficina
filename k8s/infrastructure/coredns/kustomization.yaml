apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patch opt-in: redireciona DNS do cluster para o Cloudflare Gateway.
# Requer DNS Location criada em Zero Trust > Gateway > DNS Locations.
# Ver patches/gateway-dns-forwarder.yaml para instruções de ativação.
patchesStrategicMerge:
  - patches/gateway-dns-forwarder.yaml
