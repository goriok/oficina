apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: "69.3.1"
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml

  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: "6.29.0"
    releaseName: loki
    namespace: monitoring
    valuesFile: loki-values.yaml

  - name: promtail
    repo: https://grafana.github.io/helm-charts
    version: "6.16.6"
    releaseName: promtail
    namespace: monitoring
    valuesFile: promtail-values.yaml

resources:
  - namespace.yaml
  - ingress-grafana.yaml
  - ingress-prometheus.yaml
  - servicemonitor-traefik.yaml
  - servicemonitor-litellm.yaml
  - servicemonitor-postgres.yaml
  - servicemonitor-redis.yaml
  - dashboard-litellm.yaml
  - dashboard-traefik.yaml
  - dashboard-postgres.yaml
  - dashboard-redis.yaml
  - dashboard-apps.yaml
  - datasource-loki.yaml
