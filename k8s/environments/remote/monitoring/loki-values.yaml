loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  auth_enabled: false

  limits_config:
    retention_period: 30d
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: tier
            operator: In
            values:
            - essential
  tolerations:
  - key: tier
    value: essential
    effect: NoSchedule
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: 10Gi

# Disable components not needed in SingleBinary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# Expose as ClusterIP — Promtail e Grafana acessam internamente
gateway:
  enabled: false

# Desabilita caches memcached — não necessários em SingleBinary e causam Pending por falta de tolerations
chunksCache:
  enabled: false
resultsCache:
  enabled: false
